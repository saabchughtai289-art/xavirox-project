<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAVIROX | Sync Entity</title>
  <style>
    :root{--p:#a855f7;--bg:#030305;--card:rgba(24,24,27,0.40);--border:rgba(255,255,255,0.10);--text:#fff;--muted:rgba(255,255,255,0.7)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:sans-serif;overflow:hidden;position:relative;padding:24px}
    .halo{position:absolute;inset:0;background:radial-gradient(circle at center, rgba(147,51,234,0.15) 0%, transparent 60%);z-index:0}
    .wrap{position:relative;z-index:1;width:100%;max-width:28rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 0 50px rgba(0,0,0,0.8)}
    .title{font-weight:950;letter-spacing:0.3em;color:var(--text);text-transform:uppercase;text-align:center;margin:0 0 20px 0;font-size:14px}
    .cyber-input{width:100%;background:rgba(0,0,0,0.5);border:1px solid #27272a;color:#a1a1aa;border-radius:12px;padding:14px 16px;outline:none;font-size:14px;font-weight:700;margin-bottom:12px;transition:.2s}
    .cyber-input:focus{border-color:rgba(168,85,247,0.8)}
    .btn{width:100%;background:rgba(168,85,247,0.18);border:1px solid rgba(168,85,247,0.6);color:#fff;border-radius:12px;padding:14px 16px;outline:none;cursor:pointer;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .note{font-size:12px;opacity:0.55;color:#fff;text-align:center;margin-top:15px}
    .note a{color:rgba(168,85,247,0.9);text-decoration:none;font-weight:800}
    .error{display:none;margin:10px 0 0 0;background:rgba(255,0,127,0.12);border:1px solid rgba(255,0,127,0.35);color:#ffd1e7;padding:10px 12px;border-radius:12px;font-weight:800;font-size:12px}
  </style>
</head>
<body>
  <div class="halo"></div>
  <div class="wrap">
    <div class="card">
      <div class="title">Create Neural Identity</div>

      <form id="signupForm" action="/signup" method="POST" novalidate>
        <input class="cyber-input" type="text" name="username" placeholder="CHOOSE NEURAL ID" required maxlength="32" autocomplete="username" />
        <input class="cyber-input" type="password" name="password" placeholder="CREATE ACCESS KEY" required minlength="6" maxlength="128" autocomplete="new-password" />
        <button class="btn" id="submitBtn" type="submit">Initialize Core Sync</button>
        <div class="error" id="formError"></div>
      </form>

      <div class="note">
        Already synced?
        <a href="/login">Return to Login</a>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const form = document.getElementById('signupForm');
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('formError');

      form.addEventListener('submit', async (e) => {
        err.style.display = 'none';
        const username = (form.username.value || '').trim();
        const password = form.password.value || '';

        if (!username) { e.preventDefault(); err.textContent = 'Username is required.'; err.style.display='block'; return; }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) { e.preventDefault(); err.textContent = 'Use only letters, numbers, and underscore.'; err.style.display='block'; return; }
        if (!password || password.length < 6) { e.preventDefault(); err.textContent = 'Password must be at least 6 characters.'; err.style.display='block'; return; }

        btn.disabled = true;
        btn.textContent = 'Syncing…';
      });
    })();
  </script>
</body>
</html>
