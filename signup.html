<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAVIROX | Generate Identity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cosmic: { cyan: '#00f0ff', purple: '#7000ff', pink: '#ff007f' }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite'
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.5', transform: 'scale(1)' },
                            '50%': { opacity: '1', transform: 'scale(1.05)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        };
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .stars-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 45%),
                        radial-gradient(ellipse at 70% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at center, #060a10 0%, #000 100%);
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.95; transform: scale(1.3); box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 1;
        }
        .orb-purple { width: 320px; height: 320px; background: rgba(112, 0, 255, 0.25); top: -80px; right: -60px; animation: float 8s ease-in-out infinite; }
        .orb-cyan { width: 280px; height: 280px; background: rgba(0, 240, 255, 0.12); bottom: -60px; left: -40px; animation: float 7s ease-in-out infinite reverse; }
        .signup-card {
            position: relative;
            background: rgba(9, 9, 11, 0.3);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        0 0 60px rgba(112, 0, 255, 0.12),
                        0 0 100px rgba(0, 240, 255, 0.06),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .signup-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(112, 0, 255, 0.4), transparent 40%, rgba(0, 240, 255, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
        }
        .glass-input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            background: rgba(24, 24, 27, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.35); }
        .glass-input:hover {
            transform: scale(1.01);
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(24, 24, 27, 0.55);
        }
        .glass-input:focus {
            transform: scale(1.02);
            border-color: #a855f7;
            box-shadow: 0 0 0 1px #a855f7, 0 0 24px rgba(168, 85, 247, 0.25);
            background: rgba(24, 24, 27, 0.65);
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(0, 240, 255, 0.6);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.3s;
        }
        .input-wrap:focus-within .input-icon { color: #c084fc; }
        .btn-primary {
            background: linear-gradient(90deg, #7000ff, #ff007f);
            color: #fff;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.35), 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.5), 0 0 60px rgba(0, 240, 255, 0.15);
        }
        .btn-google {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(66, 133, 244, 0.35);
            color: #fff;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(66, 133, 244, 0.15);
        }
        .btn-google:hover {
            background: rgba(66, 133, 244, 0.12);
            border-color: rgba(66, 133, 244, 0.6);
            box-shadow: 0 0 28px rgba(66, 133, 244, 0.35);
        }
        .error-banner {
            background: rgba(255, 0, 80, 0.12);
            border: 1px solid rgba(255, 0, 127, 0.35);
            backdrop-filter: blur(12px);
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation-delay: 0.5s; opacity: 0; }
        .stagger-6 { animation-delay: 0.6s; opacity: 0; }
        .stagger-7 { animation-delay: 0.7s; opacity: 0; }
        .aura-pill {
            background: rgba(255, 234, 0, 0.08);
            border: 1px solid rgba(255, 234, 0, 0.25);
            color: #ffea00;
        }
        .divider-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }
    </style>
</head>
<body class="bg-black antialiased">
    <div class="stars-layer" id="starsLayer"></div>
    <div class="orb orb-purple"></div>
    <div class="orb orb-cyan"></div>

    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 py-12">
        <a href="/" class="animate-fade-in-up opacity-0 mb-8 flex items-center gap-3 text-white/50 hover:text-cosmic-cyan transition-colors duration-300" style="animation-fill-mode: forwards;">
            <i class="fas fa-rocket text-cosmic-cyan"></i>
            <span class="text-xs font-black tracking-[0.3em] uppercase">Xavirox Cosmic OS</span>
        </a>

        <div class="signup-card w-full max-w-md p-8 sm:p-10 animate-fade-in-up opacity-0" style="animation-delay: 0.05s; animation-fill-mode: forwards;">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-600/30 to-cyan-500/20 border border-white/10 mb-5 animate-pulse-glow">
                    <i class="fas fa-user-astronaut text-2xl text-cosmic-cyan"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white mb-2">GENERATE IDENTITY</h1>
                <p class="text-sm text-white/45 font-medium">Sync your signal into the void matrix</p>
                <div class="aura-pill inline-flex items-center gap-2 mt-4 px-4 py-1.5 rounded-full text-[10px] font-black tracking-widest">
                    <i class="fas fa-bolt"></i> STARTING AURA: 100
                </div>
            </div>

            <div id="errorBanner" class="error-banner hidden mb-6 px-4 py-3 rounded-xl text-sm font-bold text-pink-300 text-center" role="alert"></div>

            <form id="signupForm" class="space-y-4" novalidate>
                <div class="input-wrap animate-fade-in-up stagger-1" style="animation-fill-mode: forwards;">
                    <i class="fas fa-at input-icon"></i>
                    <input type="text" id="username" name="username" class="glass-input" placeholder="@username" autocomplete="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+">
                </div>

                <div class="input-wrap animate-fade-in-up stagger-2" style="animation-fill-mode: forwards;">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" class="glass-input" placeholder="email@void.matrix" autocomplete="email" required>
                </div>

                <div class="input-wrap animate-fade-in-up stagger-3" style="animation-fill-mode: forwards;">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="glass-input" placeholder="Secure password (6+ chars)" autocomplete="new-password" required minlength="6">
                </div>

                <button type="submit" id="submitBtn" class="btn-primary w-full py-4 rounded-2xl text-sm animate-fade-in-up stagger-4 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300" style="animation-fill-mode: forwards;">
                    <span id="submitBtnText"><i class="fas fa-satellite-dish mr-2"></i>CREATE ACCOUNT</span>
                </button>
            </form>

            <div class="flex items-center gap-4 my-7 animate-fade-in-up stagger-5" style="animation-fill-mode: forwards;">
                <div class="divider-line flex-1"></div>
                <span class="text-[10px] font-black tracking-[0.25em] text-white/30 uppercase">or uplink via</span>
                <div class="divider-line flex-1"></div>
            </div>

            <a href="/auth/google" class="btn-google flex items-center justify-center gap-3 w-full py-4 rounded-2xl text-sm animate-fade-in-up stagger-6 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300" style="animation-fill-mode: forwards;">
                <i class="fab fa-google text-lg text-[#4285f4]"></i>
                LOGIN WITH GOOGLE
            </a>

            <p class="text-center mt-8 text-sm text-white/45 animate-fade-in-up stagger-7" style="animation-fill-mode: forwards;">
                Already synced?
                <a href="/login" class="text-cosmic-cyan font-bold hover:text-purple-400 transition-colors duration-300 ml-1 hover:underline underline-offset-4">Let him in →</a>
            </p>
        </div>

        <p class="relative z-10 mt-10 text-[9px] font-bold tracking-[0.2em] text-white/20 uppercase animate-fade-in-up opacity-0" style="animation-delay: 0.85s; animation-fill-mode: forwards;">
            © 2026 XAVIROX // VOID REGISTRATION PROTOCOL V87
        </p>
    </main>

    <script>
        (function spawnStars() {
            const layer = document.getElementById('starsLayer');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
                star.style.animationDelay = (Math.random() * 3) + 's';
                layer.appendChild(star);
            }
        })();

        const form = document.getElementById('signupForm');
        const errorBanner = document.getElementById('errorBanner');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');

        function showError(message) {
            errorBanner.textContent = message;
            errorBanner.classList.remove('hidden');
            errorBanner.classList.remove('shake');
            void errorBanner.offsetWidth;
            errorBanner.classList.add('shake');
            const card = document.querySelector('.signup-card');
            if (card) {
                card.classList.add('signup-glitch-flash');
                setTimeout(() => card.classList.remove('signup-glitch-flash'), 1200);
            }
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim().replace(/^@/, '');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
                showError('Username must be 3–20 characters (letters, numbers, underscore only).');
                return;
            }

            submitBtn.disabled = true;
            submitBtnText.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>SYNCING TO VOID...';

            try {
                const res = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    submitBtnText.innerHTML = '<i class="fas fa-check mr-2"></i>IDENTITY FORGED';
                    submitBtn.classList.add('scale-105');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard';
                    }, 600);
                } else {
                    showError(data.error || 'Registration rejected by the matrix.');
                    submitBtn.disabled = false;
                    submitBtnText.innerHTML = '<i class="fas fa-satellite-dish mr-2"></i>CREATE ACCOUNT';
                }
            } catch (err) {
                showError('Uplink failed. Check your connection and try again.');
                submitBtn.disabled = false;
                submitBtnText.innerHTML = '<i class="fas fa-satellite-dish mr-2"></i>CREATE ACCOUNT';
            }
        });
    </script>
</body>
</html>
